[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beatcheck"
version = "0.0.1"
description = "Classify beat-based stereo audio and measure beat frequency"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "soundfile"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
